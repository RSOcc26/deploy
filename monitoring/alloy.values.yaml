# Values for grafana/alloy (chart 1.14.2): collects container logs from the
# Kubernetes API and ships them to Loki. Services log structured JSON to stdout;
# only `level` becomes a label (tenant and correlation IDs stay in the log line
# to keep label cardinality low).
#   helm upgrade --install alloy grafana/alloy --version 1.14.2 \
#     -n monitoring -f monitoring/alloy.values.yaml

controller:
  # One collector tailing all pods through the API; a DaemonSet would
  # collect every log once per node.
  type: deployment
  replicas: 1

alloy:
  configMap:
    content: |
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["companycentral-dev", "companycentral-prod"]
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.process.json.receiver]
      }

      loki.process "json" {
        stage.json {
          expressions = { level = "level" }
        }
        stage.labels {
          values = { level = "" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki-gateway.monitoring.svc/loki/api/v1/push"
        }
      }
