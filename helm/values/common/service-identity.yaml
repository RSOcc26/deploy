# service-identity: values shared by every environment.
image:
  repository: ghcr.io/rsocc26/service-identity

env:
  PORT: "3000"
  KAFKA_BROKERS: companycentral-kafka-kafka-bootstrap:9092
  KAFKA_CLIENT_ID: service-identity
  KAFKA_TOPIC: identity.events
  KAFKA_SASL_MECHANISM: scram-sha-512
  KAFKA_USERNAME: kafka-identity
  TENANT_CONTEXT_JWKS_URL: http://gateway/.well-known/jwks.json
  TENANT_CONTEXT_ISSUER: companycentral-gateway
  TENANT_CONTEXT_AUDIENCE: service-identity

# Created outside Git (see docs/deployment.md) or by Strimzi.
secretEnv:
  DATABASE_URL:
    secretName: identity-database
    key: url
  # Generated by Strimzi for the KafkaUser of the same name.
  KAFKA_PASSWORD:
    secretName: kafka-identity
    key: password

migrations:
  secretName: identity-database
  key: migration-url
