# CompanyCentral login theme (ADR-0002). Keycloak still serves the pages and
# handles credentials; markup, styles and texts are ours. Built on the
# unstyled "base" theme, so no PatternFly or Keycloak branding is loaded.
parent=base
import=common/keycloak
locales=sl,en

styles=css/login.css
meta=viewport==width=device-width,initial-scale=1

# Map Keycloak's class hooks to our own CSS classes
kcHtmlClass=cc-html
kcBodyClass=cc-body
kcLoginClass=cc-page
kcFormCardClass=cc-card
kcFormHeaderClass=cc-card__header
kcContentWrapperClass=cc-row
kcLabelWrapperClass=cc-label-row
kcInputWrapperClass=cc-input-wrapper

kcFormClass=cc-form
kcFormGroupClass=cc-field
kcLabelClass=cc-label
kcInputClass=cc-input
kcTextareaClass=cc-input
kcInputGroup=cc-input-group
kcInputErrorMessageClass=cc-field__error
kcInputHelperTextBeforeClass=cc-field__help
kcInputHelperTextAfterClass=cc-field__help
kcCheckboxInputClass=cc-checkbox
kcInputClassCheckbox=cc-check
kcInputClassCheckboxInput=cc-checkbox
kcInputClassCheckboxLabel=cc-check__label
kcInputClassRadio=cc-check
kcInputClassRadioInput=cc-checkbox
kcInputClassRadioLabel=cc-check__label

kcFormOptionsClass=cc-form-options
kcFormOptionsWrapperClass=cc-form-options__links
kcFormSettingClass=cc-form-settings
kcFormButtonsClass=cc-form-buttons
kcFormButtonsWrapperClass=cc-form-buttons

kcButtonClass=cc-button
kcButtonPrimaryClass=cc-button--primary
kcButtonDefaultClass=cc-button--secondary
kcButtonSecondaryClass=cc-button--secondary
kcButtonBlockClass=cc-button--block
kcButtonLargeClass=cc-button--large

kcFormPasswordVisibilityButtonClass=cc-password-toggle
kcFormPasswordVisibilityIconShow=cc-icon cc-icon--eye
kcFormPasswordVisibilityIconHide=cc-icon cc-icon--eye-off

kcAlertClass=cc-alert
kcAlertTitleClass=cc-alert__text
kcSignUpClass=cc-signup
kcInfoAreaWrapperClass=cc-signup__inner

kcFormSocialAccountSectionClass=cc-social
kcFormSocialAccountListClass=cc-social__list
kcFormSocialAccountListButtonClass=cc-button cc-button--secondary cc-button--block

kcSelectAuthListClass=cc-select-list
kcSelectAuthListItemClass=cc-select-list__item
kcRecoveryCodesList=cc-recovery-codes
