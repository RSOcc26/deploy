# RabbitMQ broker with one vhost and one user per service (ADR-0006).
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: {{ .Values.rabbitmq.clusterName }}
  labels:
    app.kubernetes.io/part-of: companycentral
spec:
  replicas: {{ .Values.rabbitmq.replicas }}
  persistence:
    storage: {{ .Values.rabbitmq.storage.size }}
    {{- with .Values.rabbitmq.storage.storageClass }}
    storageClassName: {{ . }}
    {{- end }}
  resources:
    {{- toYaml .Values.rabbitmq.resources | nindent 4 }}
---
apiVersion: rabbitmq.com/v1beta1
kind: Vhost
metadata:
  name: {{ .Values.rabbitmq.clusterName }}-{{ .Values.rabbitmq.vhost }}
spec:
  name: {{ .Values.rabbitmq.vhost }}
  rabbitmqClusterReference:
    name: {{ .Values.rabbitmq.clusterName }}
{{- range .Values.services }}
---
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: {{ $.Values.rabbitmq.clusterName }}-{{ . }}
spec:
  rabbitmqClusterReference:
    name: {{ $.Values.rabbitmq.clusterName }}
  importCredentialsSecret:
    name: mq-{{ . }}-credentials
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: {{ $.Values.rabbitmq.clusterName }}-{{ . }}
spec:
  vhost: {{ $.Values.rabbitmq.vhost }}
  userReference:
    name: {{ $.Values.rabbitmq.clusterName }}-{{ . }}
  permissions:
    configure: ".*"
    write: ".*"
    read: ".*"
  rabbitmqClusterReference:
    name: {{ $.Values.rabbitmq.clusterName }}
{{- end }}
