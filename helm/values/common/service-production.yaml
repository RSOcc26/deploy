# service-production: values shared by every environment.
image:
  repository: ghcr.io/rsocc26/service-production

env:
  PORT: "3000"
  RABBITMQ_EXCHANGE: companycentral.events
  TENANT_CONTEXT_JWKS_URL: http://gateway/.well-known/jwks.json
  TENANT_CONTEXT_ISSUER: companycentral-gateway
  TENANT_CONTEXT_AUDIENCE: service-production
  INVENTORY_URL: http://service-inventory

# Created outside Git; see docs/deployment.md.
secretEnv:
  DATABASE_URL:
    secretName: production-database
    key: url
  RABBITMQ_URL:
    secretName: production-rabbitmq
    key: url

migrations:
  secretName: production-database
  key: migration-url
