# Required; DNS must point to the Ingress controller's load balancer.
host: ""

ingressClassName: traefik

tls:
  enabled: true
  secretName: companycentral-tls

clusterIssuer:
  name: letsencrypt-staging
  # Cluster-scoped: create each issuer name in one release only.
  create: false
  # Required when create is true.
  email: ""
  server: https://acme-staging-v02.api.letsencrypt.org/directory

# Only these are reachable from outside.
backends:
  keycloak:
    service: keycloak
    port: 80
  web:
    service: web
    port: 80
  gateway:
    service: gateway
    port: 80
