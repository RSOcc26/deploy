{{- if .Values.clusterIssuer.create }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer.name }}
spec:
  acme:
    server: {{ .Values.clusterIssuer.server }}
    email: {{ required "clusterIssuer.email is required when clusterIssuer.create is true" .Values.clusterIssuer.email }}
    privateKeySecretRef:
      name: {{ .Values.clusterIssuer.name }}-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.ingressClassName }}
{{- end }}
