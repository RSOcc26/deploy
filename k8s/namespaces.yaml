# Namespaces for CompanyCentral. Apply once per cluster:
#   kubectl apply -f k8s/namespaces.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: companycentral-dev
  labels:
    app.kubernetes.io/part-of: companycentral
    companycentral/environment: dev
---
apiVersion: v1
kind: Namespace
metadata:
  name: companycentral-prod
  labels:
    app.kubernetes.io/part-of: companycentral
    companycentral/environment: prod
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: companycentral
