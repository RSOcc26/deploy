# Local development stack for CompanyCentral.
#
#   cp .env.example .env      # then replace every placeholder password
#   docker compose up -d                    # PostgreSQL and Kafka only
#   docker compose --profile apps up -d     # plus services, gateway and web
#
# The "apps" profile pulls images from GHCR. They exist only after each
# repository publishes its first image; until then run the services from
# their own repositories with `npm run dev` against this stack.
name: companycentral

x-service: &service
  restart: unless-stopped
  profiles: [apps]
  depends_on:
    postgres:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully

x-service-env: &service-env
  PORT: "3000"
  LOG_LEVEL: ${LOG_LEVEL:-info}
  KAFKA_BROKERS: kafka:9092
  TENANT_CONTEXT_JWKS_URL: http://gateway:8080/.well-known/jwks.json
  TENANT_CONTEXT_ISSUER: companycentral-gateway

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SERVICES: identity access workflow inventory production
      IDENTITY_MIGRATOR_PASSWORD: ${IDENTITY_MIGRATOR_PASSWORD:?}
      IDENTITY_APP_PASSWORD: ${IDENTITY_APP_PASSWORD:?}
      ACCESS_MIGRATOR_PASSWORD: ${ACCESS_MIGRATOR_PASSWORD:?}
      ACCESS_APP_PASSWORD: ${ACCESS_APP_PASSWORD:?}
      WORKFLOW_MIGRATOR_PASSWORD: ${WORKFLOW_MIGRATOR_PASSWORD:?}
      WORKFLOW_APP_PASSWORD: ${WORKFLOW_APP_PASSWORD:?}
      INVENTORY_MIGRATOR_PASSWORD: ${INVENTORY_MIGRATOR_PASSWORD:?}
      INVENTORY_APP_PASSWORD: ${INVENTORY_APP_PASSWORD:?}
      PRODUCTION_MIGRATOR_PASSWORD: ${PRODUCTION_MIGRATOR_PASSWORD:?}
      PRODUCTION_APP_PASSWORD: ${PRODUCTION_APP_PASSWORD:?}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Single-node Kafka in KRaft mode (combined broker and controller).
  # Containers use kafka:9092; tools on the host use localhost:9094.
  # No authentication locally; per-service users and ACLs exist in Kubernetes.
  # Data is not persisted: recreating the container starts with empty topics.
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      CLUSTER_ID: hAu6N3RqQ2ixwsvVzhmvnA   # any base64 UUID; identifies the local cluster
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "127.0.0.1:9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Creates the same topics as the Kubernetes platform chart. Idempotent.
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP: kafka:9092
      EVENT_TOPICS: identity.events access.events workflow.events inventory.events production.events
      DEAD_LETTER_TOPICS: access.dlt workflow.dlt inventory.dlt production.dlt gateway.dlt
      PARTITIONS: "3"
      RETENTION_MS: "604800000"
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/create-topics.sh"]

  service-identity:
    <<: *service
    image: ghcr.io/rsocc26/service-identity:${IMAGE_TAG:-main}
    environment:
      <<: *service-env
      DATABASE_URL: postgres://identity_app:${IDENTITY_APP_PASSWORD}@postgres:5432/identity
      DATABASE_MIGRATION_URL: postgres://identity_migrator:${IDENTITY_MIGRATOR_PASSWORD}@postgres:5432/identity
      KAFKA_CLIENT_ID: service-identity
      KAFKA_TOPIC: identity.events
      TENANT_CONTEXT_AUDIENCE: service-identity
    ports: ["127.0.0.1:3001:3000"]

  service-access:
    <<: *service
    image: ghcr.io/rsocc26/service-access:${IMAGE_TAG:-main}
    environment:
      <<: *service-env
      DATABASE_URL: postgres://access_app:${ACCESS_APP_PASSWORD}@postgres:5432/access
      DATABASE_MIGRATION_URL: postgres://access_migrator:${ACCESS_MIGRATOR_PASSWORD}@postgres:5432/access
      KAFKA_CLIENT_ID: service-access
      KAFKA_TOPIC: access.events
      KAFKA_GROUP_ID: access
      KAFKA_CONSUME_TOPICS: identity.events
      KAFKA_DLT_TOPIC: access.dlt
      TENANT_CONTEXT_AUDIENCE: service-access
    ports: ["127.0.0.1:3002:3000"]

  service-workflow:
    <<: *service
    image: ghcr.io/rsocc26/service-workflow:${IMAGE_TAG:-main}
    environment:
      <<: *service-env
      DATABASE_URL: postgres://workflow_app:${WORKFLOW_APP_PASSWORD}@postgres:5432/workflow
      DATABASE_MIGRATION_URL: postgres://workflow_migrator:${WORKFLOW_MIGRATOR_PASSWORD}@postgres:5432/workflow
      KAFKA_CLIENT_ID: service-workflow
      KAFKA_TOPIC: workflow.events
      KAFKA_GROUP_ID: workflow
      KAFKA_CONSUME_TOPICS: production.events
      KAFKA_DLT_TOPIC: workflow.dlt
      TENANT_CONTEXT_AUDIENCE: service-workflow
    ports: ["127.0.0.1:3003:3000"]

  service-inventory:
    <<: *service
    image: ghcr.io/rsocc26/service-inventory:${IMAGE_TAG:-main}
    environment:
      <<: *service-env
      DATABASE_URL: postgres://inventory_app:${INVENTORY_APP_PASSWORD}@postgres:5432/inventory
      DATABASE_MIGRATION_URL: postgres://inventory_migrator:${INVENTORY_MIGRATOR_PASSWORD}@postgres:5432/inventory
      KAFKA_CLIENT_ID: service-inventory
      KAFKA_TOPIC: inventory.events
      KAFKA_GROUP_ID: inventory
      KAFKA_CONSUME_TOPICS: production.events,workflow.events
      KAFKA_DLT_TOPIC: inventory.dlt
      TENANT_CONTEXT_AUDIENCE: service-inventory
    ports: ["127.0.0.1:3004:3000"]

  service-production:
    <<: *service
    image: ghcr.io/rsocc26/service-production:${IMAGE_TAG:-main}
    environment:
      <<: *service-env
      DATABASE_URL: postgres://production_app:${PRODUCTION_APP_PASSWORD}@postgres:5432/production
      DATABASE_MIGRATION_URL: postgres://production_migrator:${PRODUCTION_MIGRATOR_PASSWORD}@postgres:5432/production
      KAFKA_CLIENT_ID: service-production
      KAFKA_TOPIC: production.events
      KAFKA_GROUP_ID: production
      KAFKA_CONSUME_TOPICS: inventory.events,workflow.events
      KAFKA_DLT_TOPIC: production.dlt
      TENANT_CONTEXT_AUDIENCE: service-production
      INVENTORY_URL: http://service-inventory:3000
    ports: ["127.0.0.1:3005:3000"]

  gateway:
    image: ghcr.io/rsocc26/gateway:${IMAGE_TAG:-main}
    restart: unless-stopped
    profiles: [apps]
    environment:
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      IDENTITY_URL: http://service-identity:3000
      ACCESS_URL: http://service-access:3000
      WORKFLOW_URL: http://service-workflow:3000
      INVENTORY_URL: http://service-inventory:3000
      PRODUCTION_URL: http://service-production:3000
      TENANT_CONTEXT_ISSUER: companycentral-gateway
      TENANT_CONTEXT_SIGNING_KEY_FILE: /run/secrets/tenant-context-key
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: gateway
      KAFKA_CONSUME_TOPICS: identity.events,access.events
    secrets:
      - tenant-context-key
    ports: ["127.0.0.1:8080:8080"]

  web:
    image: ghcr.io/rsocc26/web:${IMAGE_TAG:-main}
    restart: unless-stopped
    profiles: [apps]
    environment:
      API_BASE_PATH: /api
      DEFAULT_LOCALE: sl
    ports: ["127.0.0.1:8081:8080"]

secrets:
  tenant-context-key:
    # Generate locally (see README); the file is git-ignored.
    file: ./.local/tenant-context-key.pem

volumes:
  postgres-data:
