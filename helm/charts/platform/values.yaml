# Requires the CloudNativePG and Strimzi operators (k8s/README.md).
# Never put credentials in values: scripts/create-secrets.sh and Strimzi create them.

services:
  - identity
  - access
  - workflow
  - inventory
  - production

  - keycloak

postgres:
  clusterName: companycentral-pg
  instances: 1
  storage:
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

kafka:
  clusterName: companycentral-kafka
  # Must be supported by the Strimzi operator (k8s/README.md).
  version: "4.3.1"
  # Combined controller and broker nodes (KRaft). Replication factor and
  # min.insync.replicas follow this number, capped at 3.
  replicas: 1
  storage:
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 2Gi
  topics:
    partitions: 3
    retentionHours: 168
  # Mirrors the event catalog in the organization's architecture document.
  clients:
    identity:
      produces: identity.events
      consumes: []
    access:
      produces: access.events
      consumes: [identity.events]
    workflow:
      produces: workflow.events
      consumes: [production.events]
    inventory:
      produces: inventory.events
      consumes: [workflow.events, production.events]
    production:
      produces: production.events
      consumes: [workflow.events, inventory.events]
    gateway:
      produces: ""
      consumes: [identity.events, access.events]
