# gateway: development environment.
image:
  # Moving branch tag published from main; fine for dev only.
  tag: main
  pullPolicy: Always

replicaCount: 1

env:
  LOG_LEVEL: debug
  # Public Keycloak realm on the dev host (edge and keycloak --set host)
  OIDC_ISSUER: https://dev.68-210-93-25.sslip.io/idp/realms/companycentral

# Off until kube-prometheus-stack is installed
metrics:
  serviceMonitor:
    enabled: false
