# service-access: values shared by every environment.
image:
  repository: ghcr.io/rsocc26/service-access

env:
  PORT: "3000"
  KAFKA_BROKERS: companycentral-kafka-kafka-bootstrap:9092
  KAFKA_CLIENT_ID: service-access
  KAFKA_TOPIC: access.events
  KAFKA_GROUP_ID: access
  KAFKA_CONSUME_TOPICS: identity.events
  KAFKA_DLT_TOPIC: access.dlt
  KAFKA_SASL_MECHANISM: scram-sha-512
  KAFKA_USERNAME: kafka-access
  TENANT_CONTEXT_JWKS_URL: http://gateway/.well-known/jwks.json
  TENANT_CONTEXT_ISSUER: companycentral-gateway
  TENANT_CONTEXT_AUDIENCE: service-access

# Created outside Git (see docs/deployment.md) or by Strimzi.
secretEnv:
  DATABASE_URL:
    secretName: access-database
    key: url
  # Generated by Strimzi for the KafkaUser of the same name.
  KAFKA_PASSWORD:
    secretName: kafka-access
    key: password

migrations:
  secretName: access-database
  key: migration-url
