# service-workflow: values shared by every environment.
image:
  repository: ghcr.io/rsocc26/service-workflow

env:
  PORT: "3000"
  KAFKA_BROKERS: companycentral-kafka-kafka-bootstrap:9092
  KAFKA_CLIENT_ID: service-workflow
  KAFKA_TOPIC: workflow.events
  KAFKA_GROUP_ID: workflow
  KAFKA_CONSUME_TOPICS: production.events
  KAFKA_DLT_TOPIC: workflow.dlt
  KAFKA_SASL_MECHANISM: scram-sha-512
  KAFKA_USERNAME: kafka-workflow
  TENANT_CONTEXT_JWKS_URL: http://gateway/.well-known/jwks.json
  TENANT_CONTEXT_ISSUER: companycentral-gateway
  TENANT_CONTEXT_AUDIENCE: service-workflow

# Created outside Git (see docs/deployment.md) or by Strimzi.
secretEnv:
  DATABASE_URL:
    secretName: workflow-database
    key: url
  # Generated by Strimzi for the KafkaUser of the same name.
  KAFKA_PASSWORD:
    secretName: kafka-workflow
    key: password

migrations:
  secretName: workflow-database
  key: migration-url
