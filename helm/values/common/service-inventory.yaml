# service-inventory: values shared by every environment.
image:
  repository: ghcr.io/rsocc26/service-inventory

env:
  PORT: "3000"
  KAFKA_BROKERS: companycentral-kafka-kafka-bootstrap:9092
  KAFKA_CLIENT_ID: service-inventory
  KAFKA_TOPIC: inventory.events
  KAFKA_GROUP_ID: inventory
  KAFKA_CONSUME_TOPICS: production.events,workflow.events
  KAFKA_DLT_TOPIC: inventory.dlt
  KAFKA_SASL_MECHANISM: scram-sha-512
  KAFKA_USERNAME: kafka-inventory
  TENANT_CONTEXT_JWKS_URL: http://gateway/.well-known/jwks.json
  TENANT_CONTEXT_ISSUER: companycentral-gateway
  TENANT_CONTEXT_AUDIENCE: service-inventory

# Created outside Git (see docs/deployment.md) or by Strimzi.
secretEnv:
  DATABASE_URL:
    secretName: inventory-database
    key: url
  # Generated by Strimzi for the KafkaUser of the same name.
  KAFKA_PASSWORD:
    secretName: kafka-inventory
    key: password

migrations:
  secretName: inventory-database
  key: migration-url
