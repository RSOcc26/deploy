# Stateful platform components for one environment (namespace).
# Requires the CloudNativePG and Strimzi operators (see k8s/README.md).
# Database credentials are Secrets created by scripts/create-secrets.sh;
# Kafka passwords are generated by Strimzi. Never put credentials in values.

# Services that get their own database and database roles.
services:
  - identity
  - access
  - workflow
  - inventory
  - production

postgres:
  clusterName: companycentral-pg
  instances: 1
  storage:
    size: 5Gi
    # Empty: the cluster's default StorageClass.
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

kafka:
  clusterName: companycentral-kafka
  # A Kafka version supported by the Strimzi operator (k8s/README.md).
  version: "4.3.1"
  # Combined controller and broker nodes (KRaft). Replication factor and
  # min.insync.replicas follow this number, capped at 3.
  replicas: 1
  storage:
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 2Gi
  topics:
    partitions: 3
    # Events stay available for replay this long.
    retentionHours: 168
  # Every Kafka client: the topic it publishes to and the topics it reads.
  # Mirrors the event catalog in the organization's architecture document.
  clients:
    identity:
      produces: identity.events
      consumes: []
    access:
      produces: access.events
      consumes: [identity.events]
    workflow:
      produces: workflow.events
      consumes: [production.events]
    inventory:
      produces: inventory.events
      consumes: [workflow.events, production.events]
    production:
      produces: production.events
      consumes: [workflow.events, inventory.events]
    gateway:
      produces: ""
      consumes: [identity.events, access.events]
