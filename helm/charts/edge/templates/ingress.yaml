apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: companycentral
  labels:
    app.kubernetes.io/part-of: companycentral
  {{- if .Values.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer.name }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  {{- if .Values.tls.enabled }}
  tls:
    - hosts:
        - {{ required "host is required" .Values.host }}
      secretName: {{ .Values.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ required "host is required" .Values.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.backends.gateway.service }}
                port:
                  number: {{ .Values.backends.gateway.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.backends.web.service }}
                port:
                  number: {{ .Values.backends.web.port }}
