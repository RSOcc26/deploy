image:
  repository: ghcr.io/rsocc26/service-identity

env:
  PORT: "3000"
  KAFKA_BROKERS: companycentral-kafka-kafka-bootstrap:9092
  KAFKA_CLIENT_ID: service-identity
  KAFKA_TOPIC: identity.events
  KAFKA_SASL_MECHANISM: scram-sha-512
  KAFKA_USERNAME: kafka-identity
  TENANT_CONTEXT_JWKS_URL: http://gateway/.well-known/jwks.json
  TENANT_CONTEXT_ISSUER: companycentral-gateway
  TENANT_CONTEXT_AUDIENCE: service-identity
  # Keycloak admin API over the cluster network (ADR-0003)
  IDP_ADMIN_URL: http://keycloak/idp/admin/realms/companycentral
  IDP_TOKEN_URL: http://keycloak/idp/realms/companycentral/protocol/openid-connect/token
  IDP_CLIENT_ID: service-identity

# Created outside Git (see docs/deployment.md) or by Strimzi.
secretEnv:
  DATABASE_URL:
    secretName: identity-database
    key: url
  # The service migrates itself at startup as the migration role
  DATABASE_MIGRATION_URL:
    secretName: identity-database
    key: migration-url
  IDP_CLIENT_SECRET:
    secretName: identity-idp-client
    key: secret
  KAFKA_PASSWORD:
    secretName: kafka-identity
    key: password

migrations:
  secretName: identity-database
  key: migration-url
