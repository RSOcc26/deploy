# service-production: values shared by every environment.
image:
  repository: ghcr.io/rsocc26/service-production

env:
  PORT: "3000"
  KAFKA_BROKERS: companycentral-kafka-kafka-bootstrap:9092
  KAFKA_CLIENT_ID: service-production
  KAFKA_TOPIC: production.events
  KAFKA_GROUP_ID: production
  KAFKA_CONSUME_TOPICS: inventory.events,workflow.events
  KAFKA_DLT_TOPIC: production.dlt
  KAFKA_SASL_MECHANISM: scram-sha-512
  KAFKA_USERNAME: kafka-production
  TENANT_CONTEXT_JWKS_URL: http://gateway/.well-known/jwks.json
  TENANT_CONTEXT_ISSUER: companycentral-gateway
  TENANT_CONTEXT_AUDIENCE: service-production
  INVENTORY_URL: http://service-inventory

# Created outside Git (see docs/deployment.md) or by Strimzi.
secretEnv:
  DATABASE_URL:
    secretName: production-database
    key: url
  # Generated by Strimzi for the KafkaUser of the same name.
  KAFKA_PASSWORD:
    secretName: kafka-production
    key: password

migrations:
  secretName: production-database
  key: migration-url
